[project]
name = "freshdesk-tui"
version = "0.1.0"
description = "TUI issue browser for Freshdesk support portals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=3.0",
    "httpx",
    "markdownify",
]

[project.scripts]
freshdesk-tui = "freshdesk_tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
